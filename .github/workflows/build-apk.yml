name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download game
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create apk-build com.example.mygame MyGame

      - name: Copy game files
        run: |
          rm -rf apk-build/www/*
          cp -r ./* apk-build/www/
          rm -rf apk-build/www/.git
          rm -rf apk-build/www/.github

      - name: Add Android platform
        working-directory: apk-build
        run: cordova platform add android

      - name: Build APK
        working-directory: apk-build
        run: cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-game-apk
          path: apk-build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
